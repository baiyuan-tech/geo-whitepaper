name: Build Whitepaper PDF

on:
  push:
    branches: [main]
    paths:
      - 'zh-TW/**'
      - 'en/**'
      - 'ja/**'
      - 'README.md'
      - 'assets/pdf/**'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    paths:
      - 'zh-TW/**'
      - 'en/**'
      - 'ja/**'
      - 'assets/pdf/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zh-TW:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install XeLaTeX + CJK fonts + Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-fonts-recommended \
            texlive-latex-extra texlive-latex-recommended \
            lmodern \
            fonts-noto-cjk fonts-noto-cjk-extra \
            fonts-noto-color-emoji pandoc librsvg2-bin
          sudo fc-cache -fv > /dev/null

      - name: Verify CJK font + xeCJK + lmodern presence (hard assert)
        run: |
          pandoc --version | head -2
          xelatex --version | head -1
          fc-list :lang=zh-tw | grep -qi noto || { echo "FATAL: no Noto CJK zh-tw" >&2; exit 1; }
          kpsewhich xeCJK.sty > /dev/null || { echo "FATAL: xeCJK.sty missing" >&2; exit 1; }
          kpsewhich lmodern.sty > /dev/null || { echo "FATAL: lmodern.sty missing" >&2; exit 1; }
          echo "Prerequisites OK."

      - name: Concatenate Markdown chapters
        run: |
          chmod +x assets/pdf/concat.sh
          bash assets/pdf/concat.sh zh-TW > whitepaper-zh-TW.md
          wc -l whitepaper-zh-TW.md

      - name: Install mermaid-cli (diagram rendering; best-effort, falls back to placeholder)
        run: |
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libasound2t64 \
            libpangocairo-1.0-0 libgtk-3-0 libxshmfence1 libxdamage1 libxcomposite1 \
            libxrandr2 libxkbcommon0 libxfixes3 fonts-noto-cjk fonts-noto-color-emoji || true
          npm install -g @mermaid-js/mermaid-cli@11 || echo "mmdc install failed"
          printf '{"args":["--no-sandbox","--disable-gpu","--disable-dev-shm-usage"]}' > /tmp/puppeteer.json
          mmdc --version || echo "mmdc unavailable — diagrams will use placeholder text"

      - name: Preprocess for XeLaTeX compatibility (render mermaid to PNG, fall back to placeholder)
        # Mermaid blocks → rendered PNG embedded in the PDF (falls back to placeholder text if mmdc fails).
        # Emoji stripped (CJK fonts don't cover them; decorative only).
        # Variation selectors and ZWJ removed (confuse fontspec).
        run: |
          python3 <<'PY'
          import re
          import subprocess, os
          p = 'whitepaper-zh-TW.md'
          PLACEHOLDER = '*[Mermaid diagram — see web version on GitHub]*'
          text = open(p, 'r', encoding='utf-8').read()

          _n = [0]
          def _render_mermaid(m):
              src = m.group(1); i = _n[0]; _n[0] += 1
              mmd, png = f'diagram_{i}.mmd', f'diagram_{i}.png'
              open(mmd, 'w', encoding='utf-8').write(src)
              try:
                  r = subprocess.run(['mmdc', '-i', mmd, '-o', png, '-b', 'white', '-s', '2',
                                      '--puppeteerConfigFile', '/tmp/puppeteer.json'],
                                     capture_output=True, timeout=180)
                  if r.returncode == 0 and os.path.exists(png) and os.path.getsize(png) > 1000:
                      print(f'[mermaid] rendered {png}')
                      return f'\n\n![]({png}){{width=78%}}\n\n'
                  print(f'[mermaid] mmdc rc={r.returncode} for diagram {i} -> placeholder')
              except Exception as e:
                  print(f'[mermaid] exception for diagram {i}: {e} -> placeholder')
              return PLACEHOLDER
          text = re.sub(r'```mermaid\s*\n(.*?)\n```', _render_mermaid, text, flags=re.DOTALL)

          emoji_ranges = (
            (0x1F300, 0x1F64F), (0x1F680, 0x1F6FF), (0x1F700, 0x1F77F),
            (0x1F780, 0x1F7FF), (0x1F800, 0x1F8FF), (0x1F900, 0x1F9FF),
            (0x1FA00, 0x1FA6F), (0x1FA70, 0x1FAFF), (0x2600, 0x26FF),
            (0x2700, 0x27BF), (0x1F1E6, 0x1F1FF),
          )
          def is_emoji(cp):
              return any(lo <= cp <= hi for lo, hi in emoji_ranges)
          text = ''.join('' if is_emoji(ord(c)) else c for c in text)
          text = text.replace('\uFE0F', '').replace('\uFE0E', '').replace('\u200D', '')
          # Body font (lmroman10) lacks these glyphs — substitute ASCII fallbacks for PDF
          text = text.replace('\u2194', ' <-> ').replace('\u2260', ' != ')

          open(p, 'w', encoding='utf-8').write(text)
          print(f'[preprocess] {len(text)} chars after cleanup')
          PY

      - name: Build PDF via Pandoc + XeLaTeX (with pipefail + full log)
        id: pandoc
        run: |
          set -eo pipefail
          pandoc whitepaper-zh-TW.md \
            --pdf-engine=xelatex \
            --verbose \
            --metadata-file=assets/pdf/metadata-zh-TW.yaml \
            --toc --toc-depth=3 \
            --highlight-style=tango \
            -V documentclass=report \
            -V CJKmainfont="Noto Serif CJK TC" \
            -V CJKsansfont="Noto Sans CJK TC" \
            -V CJKmonofont="Noto Sans CJK TC" \
            -V geometry:a4paper \
            -V geometry:margin=2.5cm \
            -V colorlinks=true \
            -V linkcolor=teal \
            -V urlcolor=blue \
            -V toccolor=black \
            -V lang=zh-TW \
            -o whitepaper-zh-TW.pdf 2>&1 | tee build.log
          echo "--- pandoc exit: success ---"
          ls -la whitepaper-zh-TW.pdf

      - name: Surface pandoc error as annotation + step summary (always)
        if: always()
        run: |
          # Emit the first LaTeX error line as a workflow error annotation
          # so it's accessible via the unauthenticated check-runs API.
          if [ -f build.log ]; then
            err_line=$(grep -m1 -E '^! |^Error producing PDF|fontspec Error|Undefined control sequence' build.log || true)
            if [ -z "$err_line" ]; then
              err_line=$(tail -30 build.log | grep -v '^$' | tail -3 | tr '\n' ' | ')
            fi
            msg=$(printf '%s' "$err_line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/:/%3A/g')
            echo "::error title=Pandoc PDF build failure (zh-TW)::${msg:0:500}"

            {
              echo "## Pandoc Build Log (zh-TW)"
              echo ""
              echo "First 50 lines that mention an error:"
              echo '```'
              grep -nE '^! |error|Error|fatal|FATAL|fontspec' build.log | head -50 || echo "(no error pattern matched)"
              echo '```'
              echo ""
              echo "## Last 300 lines of build.log"
              echo '```'
              tail -300 build.log
              echo '```'
              echo ""
              echo "## Concatenated Markdown preview (first 60 lines)"
              echo '```markdown'
              [ -f whitepaper-zh-TW.md ] && head -60 whitepaper-zh-TW.md
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::build.log not produced; earlier step failed before pandoc invocation"
          fi

      - name: Upload artifacts (always, for debugging on failure too)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: whitepaper-zh-TW
          path: |
            whitepaper-zh-TW.pdf
            whitepaper-zh-TW.md
            build.log
          retention-days: 90
          if-no-files-found: warn

      - name: Attach PDF to release (rolling draft on main)
        # 原本 tag_name 寫死 v1.0-draft —— release 事件時 PDF 仍被塞進草稿 tag,
        # 該 release 本身沒有 PDF。姊妹專案 pif-whitepaper 踩過同一個雷
        # (v0.2.x 各 release 都沒 PDF,2026-06 修),此處同步修法:
        # release 事件用觸發它的 tag,main push 才維持滾動草稿。
        if: (github.event_name == 'release' || github.ref == 'refs/heads/main') && success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v1.0-draft' }}
          files: whitepaper-zh-TW.pdf
          fail_on_unmatched_files: true

  build-en:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install XeLaTeX + Pandoc
        # English build needs neither CJK fonts nor xeCJK, but we reuse lmodern
        # + latex-recommended for consistency with the zh-TW job.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended \
            texlive-latex-extra texlive-latex-recommended \
            lmodern \
            fonts-noto-color-emoji pandoc librsvg2-bin
          sudo fc-cache -fv > /dev/null

      - name: Verify XeLaTeX + lmodern presence (hard assert)
