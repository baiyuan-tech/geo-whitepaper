      - name: Attach PDF to release (rolling draft on main)
        # 原本 tag_name 寫死 v1.0-draft —— release 事件時 PDF 仍被塞進草稿 tag,
        # 該 release 本身沒有 PDF。姊妹專案 pif-whitepaper 踩過同一個雷
        # (v0.2.x 各 release 都沒 PDF,2026-06 修),此處同步修法:
        # release 事件用觸發它的 tag,main push 才維持滾動草稿。
        if: (github.event_name == 'release' || github.ref == 'refs/heads/main') && success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v1.0-draft' }}
          files: whitepaper-ja.pdf
          fail_on_unmatched_files: true

  # ── Zenodo 存放(release 時才跑)───────────────────────────────────────
  # 等三個語系 job 都完成才跑一次 —— 若把存放塞進各語系 job,會建出三個 Zenodo 版本。
  #
  # ⚠ 前提:GitHub↔Zenodo webhook 必須關閉(Zenodo → Applications → GitHub)。
  # 兩者並存會讓每次發版產生兩筆記錄(webhook 的 ZIP-only + 本 job 的 PDF 版),
  # 且 webhook 若較晚完成,concept DOI 會指向沒有 PDF 的那筆 —— 等於白做。
  zenodo:
    name: Deposit PDFs to Zenodo
    needs: [build-zh-TW, build-en, build-ja]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download built PDFs
        uses: actions/download-artifact@v7
        with:
          pattern: whitepaper-*
          merge-multiple: true

      - name: Deposit to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_CONCEPT: ${{ vars.ZENODO_CONCEPT }}
        run: |
          set -eo pipefail
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "FATAL: 缺 secrets.ZENODO_TOKEN" >&2; exit 1
          fi
          if [ -z "$ZENODO_CONCEPT" ]; then
            echo "FATAL: 缺 vars.ZENODO_CONCEPT(concept record id,非 DOI 字串)" >&2; exit 1
          fi
          VER="${{ github.event.release.tag_name }}"
          VER="${VER#v}"
          ls -la whitepaper-*.pdf
          python3 assets/pdf/zenodo_deposit.py --version "$VER" --files whitepaper-*.pdf
